name: Captcha regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        shell: [bash, busybox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install lupa==2.8
      - name: Select test shell
        run: |
          if [ '${{ matrix.shell }}' = busybox ]; then
            sudo apt-get update
            sudo apt-get install -y busybox
            printf '%s\n' '#!/bin/sh' 'exec busybox ash "$@"' > /tmp/test-ash
            chmod +x /tmp/test-ash
            echo 'TEST_SHELL=/tmp/test-ash' >> "$GITHUB_ENV"
          fi
      - name: Shell syntax
        run: |
          bash -n files/root/usr/lib/xlnetacc/captcha.sh
          bash -n files/root/usr/bin/xlnetacc.sh
          bash -n files/root/usr/bin/xlnetacc-test
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ui.js
